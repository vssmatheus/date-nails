# Date Nails — servidor de WhatsApp (Evolution API) com HTTPS automático
# 1) Troque WA_DOMAIN e API_KEY no arquivo .env
# 2) docker compose up -d
services:
  evolution:
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on: [postgres]
    environment:
      SERVER_URL: https://${WA_DOMAIN}
      AUTHENTICATION_API_KEY: ${API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${DB_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CONFIG_SESSION_PHONE_CLIENT: "Date Nails"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
      LANGUAGE: pt-BR
    volumes:
      - evolution_instances:/evolution/instances
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - pgdata:/var/lib/postgresql/data
  caddy:
    image: caddy:2-alpine
    restart: always
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${WA_DOMAIN} --to evolution:8080
    volumes:
      - caddy_data:/data
volumes:
  evolution_instances:
  pgdata:
  caddy_data:
